<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Solar System — Interactive 3D</title><meta name="description" content="Explore an interactive 3D Solar System. Tap any planet to see its size, mass, gravity, temperature, moons and more."><meta name="theme-color" content="#03060f"><meta property="og:title" content="The Solar System — Interactive 3D"><meta property="og:description" content="Eight worlds, one star. Orbit, zoom and tap every planet.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8c37a;--pale:#f7e6b8;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03060f;color:#eee9dc;font-family:var(--sans);font-weight:300;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:max(16px,env(safe-area-inset-top)) 20px 0;pointer-events:none}
h1{margin:0;font:300 clamp(22px,4vw,38px)/1 var(--serif);letter-spacing:.26em;color:var(--pale);text-shadow:0 0 30px rgba(232,195,122,.45)}
h1 small{display:block;margin-top:8px;font:300 12px var(--sans);letter-spacing:.12em;color:#a9b2cc;text-shadow:none}
.ctl{display:flex;gap:8px;pointer-events:auto}
.b{border:1px solid rgba(232,195,122,.45);background:rgba(8,14,34,.6);color:var(--pale);padding:9px 16px;border-radius:999px;font:400 13px var(--sans);letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(8px);transition:box-shadow .3s}
.b:hover{box-shadow:0 0 22px rgba(232,195,122,.45)}
.b:focus-visible,.chip:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.lb{position:fixed;left:0;top:0;z-index:2;pointer-events:none;font-size:12px;letter-spacing:.14em;color:#dfe5f7;text-shadow:0 0 8px #000,0 0 3px #000;white-space:nowrap}
#hint{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.06em;color:#a9b2cc;pointer-events:none;z-index:4;transition:opacity 1s}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;overflow-x:auto;padding:12px 14px max(14px,env(safe-area-inset-bottom));scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar>:first-child{margin-left:auto}#bar>:last-child{margin-right:auto}
.chip{flex:none;display:flex;align-items:center;gap:9px;padding:6px 15px 6px 6px;border-radius:999px;border:1px solid rgba(232,195,122,.3);background:rgba(8,14,34,.62);color:#dfe5f7;font:400 13px var(--sans);cursor:pointer;backdrop-filter:blur(8px);transition:border-color .3s,box-shadow .3s}
.chip i{width:28px;height:28px;border-radius:50%;background-size:230% auto;background-position:50% 50%;box-shadow:0 0 10px var(--g)}
.chip.on{border-color:var(--gold);color:var(--pale);box-shadow:0 0 24px rgba(232,195,122,.5)}
#pn{position:fixed;z-index:7;right:20px;top:92px;width:min(390px,calc(100vw - 40px));max-height:calc(100% - 190px);overflow:auto;padding:24px;border-radius:18px;background:rgba(7,12,30,.78);backdrop-filter:blur(14px);border:1px solid rgba(232,195,122,.32);box-shadow:0 0 70px rgba(232,195,122,.13);transform:translateX(125%);opacity:0;transition:transform .8s cubic-bezier(.2,.7,.1,1),opacity .5s;visibility:hidden}
#pn.on{transform:none;opacity:1;visibility:visible}
#pn h2{margin:0;font:300 clamp(36px,5vw,50px)/1 var(--serif);color:var(--gold);text-shadow:0 0 28px rgba(232,195,122,.4)}
#pn .ty{margin:6px 0 0;color:#a9b2cc;font-size:14px}
#pn dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:18px 0}
#pn dt{color:#9aa6c7;font-size:13px}#pn dd{margin:0;font-size:14px;line-height:1.5}
#pn .ft{margin:0;padding-top:16px;border-top:1px solid rgba(232,195,122,.22);font:italic 400 20px/1.4 var(--serif);color:#eee9dc}
#pn .x{position:absolute;right:14px;top:10px;background:none;border:0;color:var(--pale);font-size:28px;cursor:pointer;line-height:1}
@media(max-width:700px){#pn{left:10px;right:10px;width:auto;top:auto;bottom:calc(66px + env(safe-area-inset-bottom));max-height:46%;padding:18px;transform:translateY(130%)}#hint{bottom:calc(70px + env(safe-area-inset-bottom))}}
#splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(70% 60% at 50% 45%,rgba(14,26,66,.5),rgba(3,6,15,.95));transition:opacity 1.4s,visibility 1.4s}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}
#splash h2{margin:0;font:300 clamp(34px,8vw,84px)/1.05 var(--serif);letter-spacing:.2em;color:var(--pale);text-shadow:0 0 50px rgba(232,195,122,.5)}
#splash p{max-width:30em;margin:16px auto 26px;color:#bcc5df}
#splash small{display:block;margin-top:18px;color:#7f89a8;font-size:12px}
.bar{width:min(260px,70vw);height:2px;margin:0 auto 22px;background:rgba(232,195,122,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:width .3s}
.b:disabled{opacity:.5;cursor:default}
.ctl{flex-wrap:wrap;justify-content:flex-end;align-items:center}
.sl{display:flex;align-items:center;gap:8px;font-size:12px;color:#a9b2cc;padding:0 6px}.sl input{width:90px;accent-color:#e8c37a}
#nogl{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:30px;text-align:center;background:#03060f;color:var(--pale);font:300 22px var(--serif)}
@media(max-width:700px){header{flex-wrap:wrap}.ctl{justify-content:flex-start}.b{padding:8px 12px;font-size:12px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of the Solar System" role="img"></canvas>
<div id="lbs"></div><div id="splash"><div><h2>THE SOLAR SYSTEM</h2><p>Eight worlds around one star. Orbit, zoom, and tap any planet to read its story.</p><div class="bar"><i id="pg"></i></div><button class="b" id="go" type="button" disabled>Loading…</button><small>Distances and sizes are compressed so every world fits on screen.</small></div></div>
<header><h1>THE SOLAR SYSTEM<small>Eight worlds around one star</small></h1><div class="ctl"><button class="b" id="tr" type="button">Guided tour</button><button class="b" id="pp" type="button">Pause orbits</button><button class="b" id="rs" type="button">Reset view</button><button class="b" id="fs" type="button">Full screen</button><label class="sl">Speed<input id="sp" type="range" min="0" max="4" step=".1" value="1" aria-label="Orbit speed"></label></div></header>
<div id="hint">Drag to orbit, pinch or scroll to zoom, tap any planet.</div>
<aside id="pn" aria-live="polite"></aside>
<nav id="bar" aria-label="Choose a planet"></nav>

function tour(on){touring=on;tT=99;$('tr').textContent=on?'Stop tour':'Guided tour'}

// camera state
var th=.6,ph=1.1,dist=330,tdist=0,foc=new THREE.Vector3(),sel=-1,paused=false,idle=0,ptr=new Map(),down=null,Z=new THREE.Vector3(),clk=new THREE.Clock(),mob=function(){return innerWidth<700};
function dflt(){return mob()?165:112}tdist=dflt();

 if(i<0){pn.classList.remove('on');tdist=dflt()}else{show(i);var r=i==8?5:D[i].r;tdist=(r*3.6+(i==5?7:5))*(mob()?1.35:1);if(chips[i].scrollIntoView)chips[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}}

 if(ptr.size==1){th-=(e.clientX-o[0])*.006;ph=Math.min(2.9,Math.max(.2,ph-(e.clientY-o[1])*.006))}
 else{var q=Array.from(ptr.values()),d0=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);ptr.set(e.pointerId,[e.clientX,e.clientY]);q=Array.from(ptr.values());var d1=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);if(d1>0)tdist=clampD(tdist*d0/d1)}

function up(e){if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);
 if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<7&&performance.now()-down.t<600){
  var rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
  var h=rc.intersectObjects(hits,false);if(h.length)select(h[0].object.userData.i)}down=null}

addEventListener('keydown',function(e){if(e.key=='Escape')select(-1);else if(e.key=='ArrowRight'||e.key=='ArrowLeft'){var k=(SEQ.indexOf(sel)+(e.key=='ArrowRight'?1:-1)+9)%9;select(SEQ[k])}else if(e.key==' '&&e.target==document.body){e.preventDefault();$('pp').click()}else if(e.key=='t'||e.key=='T')tour(!touring)});

addEventListener('resize',resize);resize();
var V=new THREE.Vector3();

 if(!paused){pl.forEach(function(p){p.ang+=p.d.sp*dt*spd;p.grp.position.set(Math.cos(p.ang)*p.d.a,0,Math.sin(p.ang)*p.d.a);p.m.rotation.y+=p.d.rot*dt*.6});sun.rotation.y+=.03*dt}

 foc.lerp(sel>=0&&sel<8?pl[sel].grp.position:Z,1-Math.pow(.002,dt));dist+=(tdist-dist)*(1-Math.pow(.03,dt));
 idle+=dt;if(sel<0&&!rd&&idle>3&&!ptr.size)th+=dt*.035;
 cam.position.set(foc.x+dist*Math.sin(ph)*Math.cos(th),foc.y+dist*Math.cos(ph),foc.z+dist*Math.sin(ph)*Math.sin(th));cam.lookAt(foc);
 var W=innerWidth,H=innerHeight;
 pl.forEach(function(p){V.copy(p.grp.position);V.y+=p.d.r*1.5+.8;V.project(cam);var s=p.lb.style;
  if(V.z>1||dist<p.d.r*5&&sel!=-1&&pl[sel]!==p){s.opacity=0}else{s.opacity=sel>=0&&pl[sel]!==p?.35:.95;s.transform='translate('+((V.x*.5+.5)*W)+'px,'+((-V.y*.5+.5)*H)+'px) translate(-50%,-100%)'}});
 rn.render(sc,cam)}
loop();
})();
